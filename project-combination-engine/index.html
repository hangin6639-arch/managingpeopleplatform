<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Combination Engine</title>
    <meta name="description" content="전략적 인적자원 네트워크 시각화 및 멀티 그래프 분석 플랫폼" />
    <meta property="og:title" content="Project Combination Engine" />
    <meta property="og:description" content="전략적 인적자원 네트워크 시각화 및 멀티 그래프 분석 플랫폼" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('toss_talent_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
